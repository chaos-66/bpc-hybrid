[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bpc-hybrid-formal"
version = "0.2.0"
description = "Audited Sun-aligned rule-first LLM-assisted BPC experiment"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audit = [
  "pytest==9.1.1",
  "spacy==3.8.13",
  "numpy==2.5.0",
]
bert = [
  "torch==2.12.1",
  "transformers==5.12.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
